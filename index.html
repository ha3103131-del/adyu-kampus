<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Adyü Kampüs</title>
<meta name="description" content="Adıyaman Üniversitesi öğrenci toplulukları, duyurular ve kampüs hayatı tek platformda.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F5F7;--ink:#101828;--mut:#5B6472;--line:#DDE1E7;--ac:#1D4ED8}
*{box-sizing:border-box;margin:0}
body{font:16px/1.6 'Schibsted Grotesk',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.w{max-width:1080px;margin:auto;padding:0 20px;width:100%}
header{position:sticky;top:0;z-index:5;background:rgba(244,245,247,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header .w{display:flex;align-items:center;justify-content:space-between;height:60px}
.brand{font-weight:800;font-size:1.15rem;letter-spacing:-.02em}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer;transition:transform .15s,background .15s}
.btn:hover{background:#1941b0}.btn:active{transform:scale(.97)}.btn:disabled{opacity:.6}
.btn.g{background:none;color:var(--ink);border:1px solid var(--line)}.btn.g:hover{background:#fff}
main{flex:1;animation:fade .3s}
@keyframes fade{from{opacity:0}}
.hero{padding:72px 20px 56px}
.hero>*{animation:up .7s cubic-bezier(.2,.7,.2,1) both}.hero>:nth-child(2){animation-delay:.12s}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
h1{font-size:clamp(2.1rem,5.5vw,3.6rem);line-height:1.07;letter-spacing:-.035em;font-weight:800;max-width:17ch}
.lead{color:var(--mut);font-size:1.15rem;margin-top:16px;max-width:46ch}
h2{font-size:1.35rem;letter-spacing:-.02em;margin:0 0 16px}
h3{font-size:1.05rem;line-height:1.35}
.mut,small{color:var(--mut)}small{font-size:.85rem}
.cols{display:grid;grid-template-columns:1fr 280px;gap:40px;margin-bottom:56px}
.ann{display:block;padding:16px 0;border-top:1px solid var(--line);transition:padding .2s}
.ann:hover{padding-left:8px}.ann:hover h3{color:var(--ac)}
.ann p{color:var(--mut);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;margin-bottom:72px}
.card{display:flex;flex-direction:column;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;transition:transform .25s,border-color .25s}
.card:hover{transform:translateY(-3px);border-color:var(--ac)}
.card p{color:var(--mut);font-size:.95rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.lg{width:48px;height:48px;border-radius:10px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800;overflow:hidden;flex:none}
.lg img{width:100%;height:100%;object-fit:cover}
.ad{display:block;background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;transition:border-color .2s}
.ad:hover{border-color:var(--ac)}.ad img{width:100%;border-radius:6px;margin-bottom:8px;max-height:140px;object-fit:cover}
.ad p{font-size:.9rem;color:var(--mut)}
.ch{display:flex;gap:18px;align-items:center;padding:48px 0 32px;animation:up .6s both}
.ch .lg{width:76px;height:76px;font-size:1.8rem;border-radius:16px}
.proj{list-style:none;padding:0;margin-bottom:40px}.proj li{padding:10px 0;border-top:1px solid var(--line)}
footer{border-top:1px solid var(--line);padding:24px 0;color:var(--mut);font-size:.9rem}
dialog{border:0;border-radius:14px;padding:26px;width:min(480px,94vw);max-height:92vh;overflow:auto;margin:auto;color:var(--ink)}
dialog[open]{animation:pop .25s cubic-bezier(.2,.7,.2,1)}
dialog::backdrop{background:rgba(16,24,40,.45)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}}
label{display:block;font-size:.9rem;font-weight:500;margin-bottom:12px}
input,select,textarea{display:block;width:100%;margin-top:4px;padding:9px 11px;font:inherit;border:1px solid var(--line);border-radius:8px;background:#fff;color:inherit}
textarea{min-height:90px;resize:vertical}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:.85rem}.chk input{width:auto;margin:3px 0 0}
.err{color:#B42318;font-size:.9rem;min-height:1.3em;margin:6px 0}
.ok{text-align:center;padding:24px 0}.ok h3{font-size:1.3rem;margin-bottom:6px}
.adm{padding-top:28px;padding-bottom:56px}.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:24px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;font:inherit;cursor:pointer;color:var(--mut)}
.tabs .on{color:var(--ink);border-color:var(--ac);font-weight:700}
.adm form{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:24px;max-width:560px}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.9rem;min-width:760px}
th,td{text-align:left;padding:9px 8px;border-top:1px solid var(--line);white-space:nowrap}
.sm{padding:5px 10px;font-size:.85rem}.dg{color:#B42318}
@media(max-width:760px){.cols{grid-template-columns:1fr}.hero{padding-top:48px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="w"><a class="brand" href="/" data-l>Adyü Kampüs</a><button class="btn" id="reg">Kayıt Ol</button></div></header>
<main id="app"></main>
<footer><div class="w" id="ft"></div></footer>

<dialog id="m">
  <form id="f" autocomplete="on">
    <h2>Kayıt ol</h2>
    <div class="r2"><label>Ad<input name="first_name" required minlength="2" maxlength="60" autocomplete="given-name"></label><label>Soyad<input name="last_name" required minlength="2" maxlength="60" autocomplete="family-name"></label></div>
    <label>Öğrenci numarası<input name="student_no" required inputmode="numeric" pattern="[0-9]{6,15}" title="Sadece rakam girin"></label>
    <label>E-posta<input name="email" type="email" required autocomplete="email"></label>
    <label>Telefon<input name="phone" type="tel" required placeholder="5xx xxx xx xx" autocomplete="tel"></label>
    <label>Bölüm<input name="department" required maxlength="100"></label>
    <label>Sınıf<select name="year" required><option value="">Seçin</option><option>Hazırlık</option><option>1. sınıf</option><option>2. sınıf</option><option>3. sınıf</option><option>4. sınıf</option><option>Lisansüstü</option></select></label>
    <label class="chk"><input type="checkbox" name="kvkk" required>KVKK aydınlatma metnini okudum, kişisel verilerimin işlenmesini kabul ediyorum.</label>
    <label class="chk"><input type="checkbox" name="cc" required>İletişim bilgilerimle bana duyuru ve bilgilendirme gönderilmesini kabul ediyorum.</label>
    <p class="err" id="msg" role="alert"></p>
    <div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn g" id="cl">Vazgeç</button><button class="btn" type="submit">Kaydı gönder</button></div>
  </form>
  <div class="ok" id="ok" hidden><h3>Kaydınız tamamlandı</h3><p class="mut">Teşekkürler. Bilgileriniz yöneticiye iletildi.</p><br><button class="btn" id="cl2">Kapat</button></div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script>
<script>
/* ====== AYARLAR: Supabase panelinden alıp yapıştırın ====== */
const SUPABASE_URL='https://bvwbgykzwckfqbhuuuke.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ2d2JneWt6d2NrZnFiaHV1dWtlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5NDE0MDAsImV4cCI6MjEwODUxNzQwMH0.vRnv9NEtq8QOJ5_v2I3DuG3-iUARyMlV1GYtmsGnXgg';
const ADMIN_EMAIL='admin@adyukampus.com'; // Supabase'de oluşturacağınız yönetici e-postası
/* ========================================================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const url=u=>/^https?:\/\//i.test(u||'')?esc(u):'';
const dt=x=>new Date(x).toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'});
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let D={c:[],a:[],ads:[],s:{}};
const app=h=>{const m=$('#app');m.style.animation='none';m.offsetHeight;m.style.animation='';m.innerHTML=h};
const cn=id=>(D.c.find(c=>c.id==id)||{}).name||'';
const logo=c=>`<span class="lg">${url(c.logo_url)?`<img src="${url(c.logo_url)}" alt="" loading="lazy">`:esc((c.name||'?')[0].toUpperCase())}</span>`;

async function load(){
  const [c,a,ad,s]=await Promise.all([
    sb.from('communities').select('*').order('created_at'),
    sb.from('announcements').select('*').order('created_at',{ascending:false}),
    sb.from('ads').select('*').order('created_at',{ascending:false}),
    sb.from('settings').select('*')]);
  D.c=c.data||[];D.a=a.data||[];D.ads=ad.data||[];D.s=Object.fromEntries((s.data||[]).map(r=>[r.key,r.value]));
  $('#ft').textContent=D.s.footer_text||'';
}
const annH=a=>`<a class="ann" data-l href="/topluluk/${a.community_id}"><small>${esc(cn(a.community_id))} &nbsp; ${dt(a.created_at)}</small><h3>${esc(a.title)}</h3><p>${esc(a.body)}</p></a>`;
const adH=a=>`<a class="ad" ${url(a.link)?`href="${url(a.link)}" target="_blank" rel="noopener sponsored"`:''}><small>Reklam</small>${url(a.image_url)?`<img src="${url(a.image_url)}" alt="" loading="lazy">`:''}<h3>${esc(a.title)}</h3><p>${esc(a.text)}</p></a>`;
const cardH=c=>`<a class="card" data-l href="/topluluk/${c.id}">${logo(c)}<h3>${esc(c.name)}</h3><p>${esc(c.description)}</p><small>${D.a.filter(a=>a.community_id==c.id).length} duyuru</small></a>`;

function home(){
  app(`<section class="w hero"><h1>${esc(D.s.hero_title)}</h1><p class="lead">${esc(D.s.hero_sub)}</p></section>
  <div class="w cols"><section><h2>Son duyurular</h2>${D.a.slice(0,12).map(annH).join('')||'<p class="mut">Henüz duyuru yok.</p>'}</section>
  <aside>${D.ads.length?'<h2>Çevremizden</h2>'+D.ads.map(adH).join(''):''}</aside></div>
  <section class="w"><h2>Topluluklar</h2><div class="grid">${D.c.map(cardH).join('')||'<p class="mut">Topluluklar yakında eklenecek.</p>'}</div></section>`);
}
function page(id){
  const c=D.c.find(x=>x.id==id);
  if(!c)return app('<div class="w hero"><h1>Topluluk bulunamadı</h1><p class="lead"><a data-l href="/" style="color:var(--ac)">Ana sayfaya dön</a></p></div>');
  const pr=(c.projects||'').split('\n').map(s=>s.trim()).filter(Boolean),an=D.a.filter(a=>a.community_id==id);
  document.title=c.name+' | Adyü Kampüs';
  app(`<div class="w"><div class="ch">${logo(c)}<div><h1 style="font-size:2rem">${esc(c.name)}</h1></div></div>
  <p style="max-width:62ch;white-space:pre-line;margin-bottom:40px">${esc(c.description)}</p>
  ${pr.length?`<h2>Projeler</h2><ul class="proj">${pr.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>`:''}
  <h2>Duyurular</h2><div style="margin-bottom:64px">${an.map(a=>`<div class="ann"><small>${dt(a.created_at)}</small><h3>${esc(a.title)}</h3><p style="-webkit-line-clamp:unset;display:block">${esc(a.body)}</p></div>`).join('')||'<p class="mut">Bu topluluk henüz duyuru paylaşmadı.</p>'}</div></div>`);
}

/* ---------- Kayıt ---------- */
$('#reg').onclick=()=>{$('#f').hidden=false;$('#ok').hidden=true;$('#msg').textContent='';$('#m').showModal()};
$('#cl').onclick=$('#cl2').onclick=()=>$('#m').close();
$('#f').onsubmit=async e=>{
  e.preventDefault();
  const f=new FormData(e.target),m=$('#msg'),b=e.target.querySelector('[type=submit]');
  let p=String(f.get('phone')).replace(/\D/g,'');
  if(p.length==12&&p.startsWith('90'))p=p.slice(2);else if(p.length==11&&p[0]=='0')p=p.slice(1);
  if(p.length!=10)return m.textContent='Telefon numarasını 10 haneli girin (örn. 5xx xxx xx xx).';
  b.disabled=true;m.textContent='';
  const {error}=await sb.from('students').insert({first_name:f.get('first_name').trim(),last_name:f.get('last_name').trim(),student_no:f.get('student_no').trim(),email:f.get('email').trim().toLowerCase(),phone:p,department:f.get('department').trim(),year:f.get('year'),kvkk:true,contact_consent:true});
  b.disabled=false;
  if(error){m.textContent=error.code=='23505'?(error.message.includes('email')?'Bu e-posta adresi zaten kayıtlı.':'Bu telefon numarası zaten kayıtlı.'):'Kayıt gönderilemedi. Bilgileri kontrol edip tekrar deneyin.';return}
  e.target.reset();e.target.hidden=true;$('#ok').hidden=false;
};

/* ---------- Yönetim paneli ---------- */
let tab='settings';
const T={
  communities:{f:[['name','Topluluk adı'],['logo_url','Logo bağlantısı (https://...)'],['description','Açıklama','ta'],['projects','Projeler (her satıra bir proje)','ta']],row:r=>esc(r.name)},
  announcements:{f:[['community_id','Topluluk','sel'],['title','Başlık'],['body','Duyuru metni','ta']],row:r=>`${esc(r.title)} <small>${esc(cn(r.community_id))}</small>`},
  ads:{f:[['title','Firma / başlık'],['text','Metin','ta'],['image_url','Görsel bağlantısı (https://...)'],['link','Tıklanınca gidilecek bağlantı']],row:r=>esc(r.title)}
};
const fld=(k,l,v,t)=>`<label>${l}${t=='ta'?`<textarea name="${k}">${esc(v)}</textarea>`:t=='sel'?`<select name="${k}" required>${D.c.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>`:`<input name="${k}" value="${esc(v)}" ${k=='name'||k=='title'?'required':''}>`}</label>`;

async function admin(){
  document.title='Yönetim | Adyü Kampüs';
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return app(`<div class="w adm"><form id="lf" style="margin:40px auto"><h2>Yönetici girişi</h2><label>Şifre<input type="password" name="p" required autocomplete="current-password"></label><p class="err" id="le"></p><button class="btn">Giriş yap</button></form></div>`),
    $('#lf').onsubmit=async e=>{e.preventDefault();const {error}=await sb.auth.signInWithPassword({email:ADMIN_EMAIL,password:e.target.p.value});error?$('#le').textContent='Şifre hatalı.':admin()};
  await load();view();
}
async function view(){
  const tabs=[['settings','Genel'],['communities','Topluluklar'],['announcements','Duyurular'],['ads','Reklamlar'],['students','Öğrenciler']];
  let body='',S=[];
  if(tab=='settings')body=`<form id="cf">${[['hero_title','Ana sayfa başlığı'],['hero_sub','Alt başlık'],['footer_text','Sayfa alt yazısı']].map(([k,l])=>fld(k,l,D.s[k])).join('')}<button class="btn">Kaydet</button></form>`;
  else if(tab=='students'){
    S=(await sb.from('students').select('*').order('created_at',{ascending:false})).data||[];
    body=`<label style="max-width:320px">Ara<input id="q" placeholder="Ad, numara, e-posta..."></label><p class="mut" style="margin-bottom:10px">${S.length} kayıt</p><div class="tw"><table><tr><th>Ad Soyad<th>No<th>E-posta<th>Telefon<th>Bölüm<th>Sınıf<th>Tarih<th>Durum<th></tr>${S.map(s=>`<tr><td>${esc(s.first_name+' '+s.last_name)}<td>${esc(s.student_no)}<td>${esc(s.email)}<td>0${esc(s.phone)}<td>${esc(s.department)}<td>${esc(s.year)}<td>${dt(s.created_at)}<td>${esc(s.status)}<td>${s.status!='onaylı'?`<button class="btn sm" data-ok="${s.id}">Onayla</button> `:''}<button class="btn g sm dg" data-del="students:${s.id}">Sil</button></tr>`).join('')}</table></div>`;
  }else{
    const t=T[tab];
    body=`<form id="cf">${t.f.map(([k,l,ty])=>fld(k,l,'',ty)).join('')}<button class="btn">Ekle</button></form>${D[{communities:'c',announcements:'a',ads:'ads'}[tab]].map(r=>`<div class="row"><span>${t.row(r)}</span><button class="btn g sm dg" data-del="${tab}:${r.id}">Sil</button></div>`).join('')}`;
  }
  app(`<div class="w adm"><div class="bar"><h2 style="margin:0">Yönetim</h2><button class="btn g" id="out">Çıkış</button></div><nav class="tabs">${tabs.map(([k,l])=>`<button data-tab="${k}" class="${k==tab?'on':''}">${l}</button>`).join('')}</nav>${body}</div>`);
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;view()});
  $('#out').onclick=async()=>{await sb.auth.signOut();admin()};
  const done=async()=>{await load();view()};
  const cf=$('#cf');
  if(cf)cf.onsubmit=async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(cf));let r;
    if(tab=='settings')r=await sb.from('settings').upsert(Object.entries(o).map(([key,value])=>({key,value})));
    else r=await sb.from(tab).insert(o);
    r.error?alert('Kaydedilemedi: '+r.error.message):done()};
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('Silinsin mi?'))return;const [t,id]=b.dataset.del.split(':');const r=await sb.from(t).delete().eq('id',id);r.error?alert(r.error.message):done()});
  document.querySelectorAll('[data-ok]').forEach(b=>b.onclick=async()=>{const r=await sb.from('students').update({status:'onaylı'}).eq('id',b.dataset.ok);r.error?alert(r.error.message):view()});
  const q=$('#q');if(q)q.oninput=()=>document.querySelectorAll('table tr+tr').forEach(r=>r.hidden=!r.textContent.toLowerCase().includes(q.value.toLowerCase()));
}

/* ---------- Yönlendirme ---------- */
const go=p=>{history.pushState({},'',p);route();scrollTo(0,0)};
document.addEventListener('click',e=>{const a=e.target.closest('a[data-l]');if(a){e.preventDefault();go(a.getAttribute('href'))}});
addEventListener('popstate',route);
async function route(){
  const p=location.pathname;document.title='Adyü Kampüs';
  if(p.startsWith('/admin'))return admin();
  if(!D.c.length&&!D.s.hero_title)await load();
  p.startsWith('/topluluk/')?page(p.split('/')[2]):home();
}
if(SUPABASE_URL.startsWith('BURAYA'))app('<div class="w hero"><h1>Kurulum gerekli</h1><p class="lead">index.html dosyasının üstündeki SUPABASE_URL ve SUPABASE_KEY alanlarını doldurun.</p></div>');
else route();
</script>
</body>
</html>
