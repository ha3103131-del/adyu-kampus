async function addMeet(e) {

  const { error } = await sb.from('meetups').insert({ user_id: user.id, interest: f.get('topic'), group_size: +f.get('size'), gender_pref: f.get('gp') });
  toast(error ? 'Eklenemedi: ' + error.message : 'Talebin alındı.'); meetView();
}
async function delMeet(id) { await sb.from('meetups').delete().eq('id', id); meetView(); }

/* ---------- profil ---------- */
async function profileView() {
  const vr = me.badge ? null : (await sb.from('verify_requests').select('user_id').eq('user_id', user.id).maybeSingle()).data;
  const ver = me.badge ? `<div class="li">${ic('shield')}<span class="t">Profilin doğrulandı${badge(me.badge)}</span></div>` : vr ? `<div class="li">${ic('shield')}<span class="t">Doğrulama isteği alındı<small>Moderatör seninle iletişime geçecek.</small></span></div>`
    : `<button class="li" onclick="reqVerify()">${ic('shield')}<span class="t">Profilimi doğrula<small>İsteğe bağlı. Onaylanınca isminin yanında mavi tik görünür.</small></span>${ic('next', 18)}</button>`;
  view(`<div class="card ctr"><div class="pav">${av(me, 96)}<label class="cam" aria-label="Fotoğraf değiştir">${ic('cam', 16)}<input type="file" accept="image/*" hidden onchange="pickPhoto(this)"></label></div>
  <h2 class="nm">${esc(me.name)}${badge(me.badge)}</h2><div class="mut">@${esc(me.username)} · ${esc([me.dept, me.year].filter(Boolean).join(' · '))}</div>
  ${me.bio ? `<p style="margin-top:12px">${esc(me.bio)}</p>` : ''}<div style="margin-top:12px">${(me.interests || []).map(t => `<span class="chip">${esc(t)}</span>`).join('')}</div></div>
  <div class="list"><button class="li" onclick="editView()">${ic('edit')}<span class="t">Profili düzenle<small>Bilgilerini ve ilgi alanlarını güncelle</small></span>${ic('next', 18)}</button>${ver}
  <label class="li">${ic('compass')}<span class="t">Keşfet'te görün<small>Kartın diğer öğrencilere gösterilsin</small></span><input type="checkbox" class="sw" ${me.discoverable ? 'checked' : ''} onchange="setDisc(this.checked)"></label>
  <button class="li" onclick="pwView()">${ic('lock')}<span class="t">Şifreyi değiştir</span>${ic('next', 18)}</button></div>
  <div class="list"><button class="li" onclick="sb.auth.signOut()">${ic('out')}<span class="t">Çıkış yap</span></button><button class="li dng" onclick="deleteMe()">${ic('trash')}<span class="t">Hesabımı sil</span></button></div>`);
}
async function pickPhoto(inp) {
  const f = inp.files[0]; if (!f) return;
  try {
    const img = await createImageBitmap(f), s = Math.min(img.width, img.height), c = document.createElement('canvas'); c.width = c.height = 480;
    c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 480, 480);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', .85)), path = `${user.id}/avatar.jpg`;
    const up = await sb.storage.from('avatars').upload(path, blob, { upsert: true, contentType: 'image/jpeg' }); if (up.error) throw up.error;
    const url = sb.storage.from('avatars').getPublicUrl(path).data.publicUrl + '?v=' + Date.now();
    await sb.from('profiles').update({ photo: url }).eq('id', user.id); me.photo = url; toast('Fotoğraf güncellendi.'); profileView();
  } catch (e) { toast('Fotoğraf yüklenemedi: ' + (e.message || 'bilinmeyen hata')); }
}
async function setDisc(v) { await sb.from('profiles').update({ discoverable: v }).eq('id', user.id); me.discoverable = v; }
async function reqVerify() { const { error } = await sb.from('verify_requests').insert({ user_id: user.id, phone: me.phone }); toast(error ? 'Gönderilemedi: ' + error.message : 'İsteğin alındı.'); profileView(); }
function editView() {
  const igc = me.contact_type === 'instagram';
  view(`<button class="back" onclick="profileView()">${ic('back', 20)}Profil</button><h1>Profili düzenle</h1>
  <form class="card" style="margin-top:16px" onsubmit="saveProfile(event)"><label class="f" style="margin-top:0" for="n">Ad soyad</label><input id="n" name="name" required maxlength="40" value="${esc(me.name)}">
  <label class="f" for="d">Bölüm</label><input id="d" name="dept" maxlength="60" value="${esc(me.dept)}">
  <label class="f" for="y">Sınıf</label><select id="y" name="year">${YEARS.map(y => `<option ${y === me.year ? 'selected' : ''}>${y}</option>`).join('')}</select>
  <label class="f" for="b">Hakkında</label><textarea id="b" name="bio" rows="3" maxlength="140" placeholder="Kısaca kendinden bahset">${esc(me.bio)}</textarea>
  <label class="f">İlgi alanların</label><div class="ch">${INTERESTS.map(t => `<label><input type="checkbox" name="tag" value="${t}" ${(me.interests || []).includes(t) ? 'checked' : ''}><span>${t}</span></label>`).join('')}</div>
  <label class="f">Eşleşmelerde paylaşılacak iletişim</label><div class="sg"><label><input type="radio" name="ct" value="phone" ${igc ? '' : 'checked'}><span>Telefon</span></label><label><input type="radio" name="ct" value="instagram" ${igc ? 'checked' : ''}><span>Instagram</span></label></div>
  <input name="contact" required style="margin-top:8px" placeholder="905xxxxxxxxx ya da kullanıcı adı" value="${esc(me.contact)}"><button class="btn w">Kaydet</button></form>`);
}
async function saveProfile(e) {
  e.preventDefault(); const f = new FormData(e.target);
  const row = { name: f.get('name').trim(), dept: f.get('dept').trim(), year: f.get('year'), bio: f.get('bio').trim(), interests: f.getAll('tag'), contact_type: f.get('ct'), contact: f.get('contact').trim() };
  const { error } = await sb.from('profiles').update(row).eq('id', user.id);
  if (error) return toast('Kaydedilemedi: ' + error.message); Object.assign(me, row); toast('Profilin güncellendi.'); profileView();
}
function pwView() {
  view(`<button class="back" onclick="profileView()">${ic('back', 20)}Profil</button><h1>Şifreyi değiştir</h1><form class="card" style="margin-top:16px" onsubmit="setPw(event)">
  <label class="f" style="margin-top:0" for="p1">Yeni şifre</label><input id="p1" type="password" required minlength="6" autocomplete="new-password"><label class="f" for="p2">Yeni şifre tekrar</label><input id="p2" type="password" required minlength="6" autocomplete="new-password"><button class="btn w">Şifreyi kaydet</button></form>`);
}
async function setPw(e) {
  e.preventDefault(); if ($('#p1').value !== $('#p2').value) return toast('Şifreler aynı değil.');
  const { error } = await sb.auth.updateUser({ password: $('#p1').value }); toast(error ? 'Hata: ' + error.message : 'Şifren değiştirildi.'); if (!error) profileView();
}
async function deleteMe() { if (!confirm('Hesabın ve tüm verilerin kalıcı olarak silinecek. Emin misin?')) return; await sb.rpc('delete_me'); await sb.auth.signOut(); }

/* ---------- /admin ---------- */
function adminLogin() { view(`<div class="card"><h2 style="margin-bottom:4px">Yönetim girişi</h2>${loginForm()}</div>`); }
async function adminLoad() {
  const now = new Date().toISOString();
  const [u, v, m] = await Promise.all([sb.from('profiles').select('*').order('created_at', { ascending: false }), sb.from('verify_requests').select('*, profiles(*)').order('created_at'),
    sb.from('meetups').select('*, profiles(name,dept,year,gender,contact_type,contact,badge,photo)').eq('status', 'waiting').gt('expires_at', now).order('created_at')]);
  A = { u: u.data || [], v: v.data || [], m: m.data || [] }; adminRender();
}
const PL = { any: 'Fark etmez', kadin: 'Sadece kadınlar', erkek: 'Sadece erkekler' };
const GL = g => g === 'kadin' ? 'Kadın' : 'Erkek';
function groupsOf(list) {
  const by = {}; list.forEach(m => (by[m.interest + '|' + m.group_size] ||= []).push(m));
  const ok = (a, b) => (a.gender_pref === 'any' || a.gender_pref === b.profiles.gender) && (b.gender_pref === 'any' || b.gender_pref === a.profiles.gender);
  const ready = [], wait = [];
  for (const [key, l] of Object.entries(by)) {
    const [t, sz] = key.split('|'), n = +sz, left = []; let pool = l.slice();
    while (pool.length) {
      const seed = pool.shift(), g = [seed];
      for (const c of pool) if (g.length < n && g.every(x => ok(x, c))) g.push(c);
      if (g.length === n) { ready.push({ t, n, l: g }); pool = pool.filter(x => !g.includes(x)); } else left.push(seed);
    }
    if (left.length) wait.push({ t, n, c: left.length });
  }
  return { ready, wait };
}
function adminRender() {
  const P = A.u.filter(p => p.status === 'pending'), G = groupsOf(A.m); let body = '';
  const who = p => `<div class="row" style="border:0;padding:0">${av(p, 48)}<div class="t"><b style="display:flex;align-items:center">${esc(p.name)}${badge(p.badge)}</b><span class="mut">${esc([p.dept, p.year].filter(Boolean).join(' · '))}</span></div></div>`;
  if (atab === 'r') body = P.map(p => `<div class="card">${who(p)}<dl class="kv"><dt>Kullanıcı</dt><dd>@${esc(p.username)}</dd><dt>E-posta</dt><dd>${esc(p.email)}</dd><dt>Telefon</dt><dd><a href="tel:+${esc(p.phone)}">${esc(p.phone)}</a></dd><dt>Cinsiyet</dt><dd>${GL(p.gender)}</dd><dt>Tarih</dt><dd>${new Date(p.created_at).toLocaleString('tr-TR')}</dd></dl>
    <div class="acts"><button class="btn" onclick="approveUser('${p.id}')">Onayla</button><button class="btn dng" onclick="rejectUser('${p.id}')">Reddet</button></div></div>`).join('') || '<div class="card mut">Onay bekleyen kayıt yok.</div>';
  if (atab === 'v') body = A.v.map(r => { const p = r.profiles || {}; return `<div class="card">${who(p)}<dl class="kv"><dt>Telefon</dt><dd><a href="tel:+${esc(r.phone)}">${esc(r.phone)}</a></dd></dl>
    <div class="acts"><button class="btn" onclick="approveBadge('${r.user_id}','blue')">Onayla</button><button class="btn" style="background:#7c3aed" onclick="approveBadge('${r.user_id}','super')">Süper onay</button><button class="btn sec" onclick="rejectV('${r.user_id}')">Sil</button></div></div>`; }).join('') || '<div class="card mut">Bekleyen doğrulama isteği yok.</div>';
  if (atab === 'm') body = G.ready.map(x => `<div class="card"><h3>${esc(x.t)} · ${x.n} kişi</h3><p class="mut" style="margin-bottom:6px">${x.l.filter(m => m.profiles.gender === 'kadin').length} kadın · ${x.l.filter(m => m.profiles.gender === 'erkek').length} erkek</p>
    ${x.l.map(m => `<div class="row">${av(m.profiles, 40)}<div class="t"><b style="display:flex;align-items:center">${esc(m.profiles.name)}${badge(m.profiles.badge)}</b><span class="mut">${esc(m.profiles.dept || '')} · ${GL(m.profiles.gender)} · ister: ${PL[m.gender_pref]}</span></div>${contactLink(m.profiles.contact_type, m.profiles.contact)}</div>`).join('')}
    <button class="btn w" onclick="doneGroup('${x.l.map(m => m.id).join(',')}')">Grubu kurdum, onayla</button></div>`).join('')
    + `<div class="card"><h3 style="margin-bottom:6px">Bekleyenler</h3>${G.wait.map(w => `<div class="row"><span class="t">${esc(w.t)} · ${w.n} kişilik</span><span class="mut">${w.c} kişi bekliyor</span></div>`).join('') || '<span class="mut">Yok.</span>'}</div>`;
  if (atab === 'u') body = `<input placeholder="İsim, kullanıcı adı, bölüm ya da telefon ara" oninput="usersList(this.value)"><div id="ul" style="margin-top:14px"></div>`;
  view(`<div style="display:flex;justify-content:space-between;align-items:center"><h1>Yönetim</h1><button class="btn sec sm" onclick="sb.auth.signOut()">Çıkış</button></div>
  <div class="tabs">${[['r','Kayıtlar',P.length],['v','Doğrulama',A.v.length],['m','Buluşma',G.ready.length],['u','Kullanıcılar',A.u.length]].map(([k, l, n]) => `<button class="${atab === k ? 'on' : ''}" onclick="atab='${k}';adminRender()">${l} (${n})</button>`).join('')}</div>${body}`);
  if (atab === 'u') usersList('');
}
function usersList(q) {
  q = q.toLowerCase();
  $('#ul').innerHTML = A.u.filter(p => [p.name, p.username, p.dept, p.phone, p.email].join(' ').toLowerCase().includes(q)).map(p => `<div class="card"><div class="row" style="border:0;padding:0">${av(p, 48)}<div class="t"><b style="display:flex;align-items:center">${esc(p.name)}${badge(p.badge)}</b><span class="mut">@${esc(p.username || '')}</span></div><span class="pill ${p.status === 'approved' ? 'ok' : ''}">${p.status === 'approved' ? 'Onaylı' : 'Bekliyor'}</span></div>
  <dl class="kv"><dt>Bölüm</dt><dd>${esc([p.dept, p.year].filter(Boolean).join(' · '))}</dd><dt>E-posta</dt><dd>${esc(p.email || '-')}</dd><dt>Telefon</dt><dd>${esc(p.phone || '-')}</dd><dt>Cinsiyet</dt><dd>${p.gender ? GL(p.gender) : '-'}</dd><dt>İlgi</dt><dd>${(p.interests || []).map(esc).join(', ') || '-'}</dd><dt>Keşfet</dt><dd>${p.discoverable ? 'Açık' : 'Kapalı'}</dd><dt>Kayıt</dt><dd>${new Date(p.created_at).toLocaleDateString('tr-TR')}</dd></dl>
  <div class="acts"><select style="flex:1" onchange="setBadge('${p.id}',this.value)" aria-label="Tik"><option value="" ${!p.badge ? 'selected' : ''}>Tik yok</option><option value="blue" ${p.badge === 'blue' ? 'selected' : ''}>Mavi tik</option><option value="super" ${p.badge === 'super' ? 'selected' : ''}>Süper tik</option></select><button class="btn dng sm" onclick="rejectUser('${p.id}')">Sil</button></div></div>`).join('') || '<div class="card mut">Kullanıcı bulunamadı.</div>';
}
async function approveUser(id) { const { error } = await sb.from('profiles').update({ status: 'approved' }).eq('id', id); toast(error ? 'Hata: ' + error.message : 'Kullanıcı onaylandı.'); adminLoad(); }
async function rejectUser(id) { if (!confirm('Bu kullanıcı kalıcı olarak silinecek. Emin misin?')) return; const { error } = await sb.rpc('admin_delete_user', { uid: id }); toast(error ? 'Hata: ' + error.message : 'Kullanıcı silindi.'); adminLoad(); }
async function approveBadge(id, b) { const { error } = await sb.from('profiles').update({ badge: b }).eq('id', id); if (error) return toast('Hata: ' + error.message); await sb.from('verify_requests').delete().eq('user_id', id); toast(b === 'super' ? 'Süper tik verildi.' : 'Onaylandı.'); adminLoad(); }
async function rejectV(id) { await sb.from('verify_requests').delete().eq('user_id', id); adminLoad(); }
async function setBadge(id, b) { const { error } = await sb.from('profiles').update({ badge: b || null }).eq('id', id); toast(error ? 'Hata: ' + error.message : 'Güncellendi.'); const p = A.u.find(x => x.id === id); if (p) p.badge = b || null; }
async function doneGroup(ids) { await sb.from('meetups').update({ status: 'done' }).in('id', ids.split(',').map(Number)); toast('Grup onaylandı, kart kaldırıldı.'); adminLoad(); }
</script>
