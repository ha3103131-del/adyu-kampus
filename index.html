<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Adyü Kampüs</title>
<meta name="description" content="Adıyaman Üniversitesi öğrenci toplulukları, duyurular ve kampüs hayatı tek platformda.">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F4F8;--sf:#fff;--ink:#0E1A3A;--mu:#5B6585;--ln:#DDE2EE;--ac:#2B44FF;--aci:#fff;--pop:#FFD23F;--ok:#12805C;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0B1020;--sf:#141B33;--ink:#EEF1FB;--mu:#9AA5C8;--ln:#26305A;--ac:#7585FF;--aci:#0B1020;--ok:#4FD1A1;color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45;padding-bottom:90px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
h1{font-size:28px;line-height:1.1;font-weight:800;letter-spacing:-.02em;margin:18px 0 12px}
h2{font-size:18px;margin:22px 0 8px}
.ac{color:var(--ac)}.note,small{color:var(--mu)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:13px;display:flex;gap:12px;align-items:center;margin-bottom:10px}
.card.col{flex-direction:column;align-items:stretch;gap:8px}
.ic{width:44px;height:44px;border-radius:13px;background:var(--bg);display:grid;place-items:center;font-size:22px;flex:none}
.t{flex:1;min-width:0}.t b{display:block}
.badge{background:var(--pop);color:#1A1400;font-weight:800;border-radius:8px;padding:2px 8px;font-size:14px}
.btn{appearance:none;border:0;background:var(--ac);color:var(--aci);font:inherit;font-weight:600;border-radius:12px;padding:10px 15px;cursor:pointer}
.btn.ghost{background:none;color:var(--ac);border:1px solid var(--ac)}.btn.done{background:var(--ln);color:var(--ink)}
input,select{font:inherit;width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);color:var(--ink)}
input[type=checkbox]{width:auto;margin-top:4px}
.ck{display:flex;gap:8px;font-size:14px;color:var(--mu)}
.chips{display:flex;gap:8px;margin-bottom:12px}
.chip{border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:99px;padding:7px 16px;font:inherit;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg)}
.ad{border:1px dashed var(--mu);border-radius:16px;padding:12px 14px;margin:12px 0;background:var(--sf)}
.ad small{font-size:12px;display:block}.ad b{display:block;font-size:17px}
.stat{display:flex;gap:10px;margin:10px 0}.stat div{flex:1;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:10px 12px}.stat b{font-size:26px;display:block;line-height:1.1}
.row{display:flex;gap:8px;margin:8px 0}
.msg{padding:10px 12px;border-radius:12px;font-weight:600;background:rgba(200,50,50,.15);color:#C83232}.msg.ok{background:rgba(18,128,92,.15);color:var(--ok)}
.empty{color:var(--mu);padding:14px;border:1px dashed var(--ln);border-radius:14px;text-align:center}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--ln);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-size:11px;padding:5px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center}
nav button span{font-size:20px}nav button.on{color:var(--ac);font-weight:600}
.sheet{position:fixed;inset:0;background:rgba(5,8,20,.55);display:none;align-items:flex-end;z-index:9}.sheet.on{display:flex}
.sheet .in{background:var(--sf);width:100%;max-width:560px;margin:0 auto;border-radius:24px 24px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));text-align:center}
.code{font-size:34px;font-weight:800;letter-spacing:.06em;margin:6px 0}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav id="nav"></nav>
<div class="sheet" id="sheet"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL="https://sahhezlgqpdtvozeiacx.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNhaGhlemxncXBkdHZvemVpYWN4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxMjI1NzMsImV4cCI6MjEwODY5ODU3M30.N0F_BQFALxD2ukSTrq027QHWtD_mIGv254LT8tIJe7Q";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=i=>document.getElementById(i), v=i=>$(i).value.trim();
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let me=null,tab="home",mode="login";

async function load(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){me=null;return render()}
  const {data}=await sb.from("profiles").select("*").eq("id",session.user.id).single();
  if(!data){await sb.auth.signOut();me=null;return render()}
  me=data;render();
}
function msg(t,ok){$("am").innerHTML=`<div class="msg ${ok?"ok":""}">${esc(t)}</div>`}
async function out(){await sb.auth.signOut();me=null;render()}

function authView(){
  const r=mode==="reg";
  $("app").innerHTML=`<h1>Adyü <span class="ac">Kampüs</span></h1>
  <p class="note">Öğrenciler için, öğrenciler tarafından. Adıyaman Üniversitesi’nin resmi sitesi değildir.</p>
  <div class="chips"><button class="chip ${r?"":"on"}" onclick="mode='login';authView()">Giriş</button><button class="chip ${r?"on":""}" onclick="mode='reg';authView()">Kayıt ol</button></div>
  <div class="card col">${r?`<input id="n" placeholder="Ad soyad"><input id="no" placeholder="Öğrenci numarası" inputmode="numeric"><input id="ph" placeholder="Telefon (05xx xxx xx xx)" inputmode="tel"><input id="dp" placeholder="Bölüm"><select id="gr"><option>Hazırlık</option><option>1. sınıf</option><option>2. sınıf</option><option>3. sınıf</option><option>4. sınıf</option><option>Lisansüstü</option></select>`:""}
  <input id="em" type="email" placeholder="${r?"Üniversite e-postası":"E-posta"}"><input id="pw" type="password" placeholder="Şifre (en az 8 karakter)">
  ${r?`<label class="ck"><input type="checkbox" id="k1"><span><a href="/kvkk.html" target="_blank">KVKK aydınlatma metnini</a> okudum, kişisel verilerimin işlenmesini kabul ediyorum.</span></label><label class="ck"><input type="checkbox" id="k2"><span>Bana duyuru ve bilgilendirme gönderilmesini kabul ediyorum.</span></label>`:""}
  <button class="btn" onclick="${r?"reg()":"login()"}">${r?"Kaydı gönder":"Giriş yap"}</button><div id="am"></div></div>`;
}
async function reg(){
  if(!v("n")||!v("no")||!v("ph")||!v("em")||$("pw").value.length<8)return msg("Tüm alanları doldur, şifre en az 8 karakter olsun.");
  if(!$("k1").checked)return msg("KVKK onayı gerekli.");
  const {data,error}=await sb.auth.signUp({email:v("em"),password:$("pw").value,options:{emailRedirectTo:location.origin,
    data:{full_name:v("n"),student_no:v("no"),phone:v("ph"),department:v("dp"),grade:$("gr").value,marketing_ok:$("k2").checked}}});
  if(error)return msg(/database/i.test(error.message)?"Kayıt yapılamadı: bu öğrenci no, telefon veya e-posta zaten kayıtlı ya da e-posta üniversite e-postası değil.":error.message);
  if(data.session)return load();
  msg("Doğrulama linkini e-postana gönderdik. Linke tıkla, sonra giriş yap.",1);
}
async function login(){
  const {error}=await sb.auth.signInWithPassword({email:v("em"),password:$("pw").value});
  if(error)return msg("E-posta veya şifre hatalı ya da e-postanı henüz doğrulamadın.");
  load();
}

async function home(){
  const [a,d]=await Promise.all([sb.from("announcements").select("*").order("created_at",{ascending:false}).limit(20),sb.from("ads").select("*").eq("active",true)]);
  return `<h1>Merhaba ${esc((me.full_name||"").split(" ")[0])} 👋</h1>`+
  (d.data||[]).map(x=>`<div class="ad"><small>Reklam</small><b>${esc(x.title)}</b>${esc(x.body)}</div>`).join("")+
  `<h2>Duyurular</h2>`+((a.data||[]).map(x=>`<div class="card col"><small>${esc(x.community)}</small>${esc(x.body)}</div>`).join("")||`<div class="empty">Henüz duyuru yok.</div>`);
}
async function deals(){
  const [d,c]=await Promise.all([sb.from("deals").select("id,description,discount,shops(name,emoji)").eq("active",true),sb.from("codes").select("deal_id,used_at").eq("student_id",me.id)]);
  const m={};(c.data||[]).forEach(x=>m[x.deal_id]=x);
  return `<h1>İndirimler</h1>`+((d.data||[]).map(x=>{const k=m[x.id];
    return `<div class="card"><div class="ic">${esc(x.shops?.emoji)}</div><div class="t"><b>${esc(x.shops?.name)}</b><small>${esc(x.description)}</small><div><span class="badge">${esc(x.discount)}</span></div></div>${k?.used_at?`<button class="btn done" disabled>Kullanıldı</button>`:`<button class="btn" onclick="getCode('${x.id}')">${k?"Kodum":"Kodu al"}</button>`}</div>`}).join("")||`<div class="empty">Henüz indirim yok.</div>`);
}
async function getCode(id){
  const {data,error}=await sb.rpc("get_code",{p_deal:id});
  if(error)return alert(error.message);
  $("sheet").innerHTML=`<div class="in"><small>Kodun</small><div class="code">${esc(data)}</div><p class="note">Kasada göster. Tek kullanımlık ve sana özel.</p><button class="btn" onclick="$('sheet').classList.remove('on')">Tamam</button></div>`;
  $("sheet").classList.add("on");go("deals");
}
async function list(){
  const {data}=await sb.from("listings").select("*").order("created_at",{ascending:false}).limit(50);
  return `<h1>İlanlar</h1><div class="card col"><select id="lc"><option>İkinci el</option><option>Ev</option><option>Ders</option></select><input id="lt" placeholder="Başlık"><input id="lp" placeholder="Fiyat (örn. 200 ₺)"><button class="btn" onclick="ins('listings',{category:$('lc').value,title:v('lt'),price:v('lp')},'list')">İlan ver</button></div>`+
  (data||[]).map(x=>`<div class="card"><div class="t"><b>${esc(x.title)}</b><small>${esc(x.category)} · ${esc(x.price)}</small></div>${x.user_id===me.id||me.role==="admin"?`<button class="btn ghost" onclick="del('listings','${x.id}','list')">Sil</button>`:""}</div>`).join("");
}
async function shop(){
  const {data}=await sb.from("codes").select("code,used_at,created_at,deals(description)").order("created_at",{ascending:false}).limit(100);
  const L=data||[];
  return `<h1>Esnaf paneli</h1><div class="stat"><div><b>${L.length}</b>verilen kod</div><div><b>${L.filter(x=>x.used_at).length}</b>kullanılan</div></div>
  <div class="row"><input id="chk" placeholder="Öğrencinin kodu" autocapitalize="characters"><button class="btn" onclick="chk()">Onayla</button></div><div id="am"></div><h2>Kodlar</h2>`+
  (L.map(x=>`<div class="card"><div class="t"><b>${esc(x.code)}</b><small>${esc(x.deals?.description)}</small></div><small>${x.used_at?"Kullanıldı":"Bekliyor"}</small></div>`).join("")||`<div class="empty">Henüz kod yok.</div>`);
}
async function chk(){
  const {data,error}=await sb.rpc("use_code",{p_code:v("chk")});
  if(error)return msg(error.message);
  if(data==="ok"){msg("Geçerli kod. İndirimi uygula.",1);setTimeout(()=>go("shop"),1500)}
  else msg(data==="used"?"Bu kod daha önce kullanılmış.":"Kod bulunamadı.");
}
async function admin(){
  const cnt=t=>sb.from(t).select("*",{count:"exact",head:true});
  const [s,d,a,ad,p,c,u]=await Promise.all([sb.from("shops").select("*").order("name"),sb.from("deals").select("id,description,discount,shops(name)"),sb.from("announcements").select("*").order("created_at",{ascending:false}).limit(10),sb.from("ads").select("*"),cnt("profiles"),cnt("codes"),cnt("codes").not("used_at","is",null)]);
  const so=(s.data||[]).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("");
  const li=(arr,t,f)=>(arr.data||[]).map(x=>`<div class="card"><div class="t">${f(x)}</div><button class="btn ghost" onclick="del('${t}','${x.id}','admin')">Sil</button></div>`).join("");
  return `<h1>Yönetim</h1><div class="stat"><div><b>${p.count}</b>kullanıcı</div><div><b>${c.count}</b>kod</div><div><b>${u.count}</b>kullanıldı</div></div>
  <h2>Esnaf ekle</h2><div class="card col"><input id="sn" placeholder="İşletme adı"><input id="se" placeholder="Emoji (☕)"><button class="btn" onclick="ins('shops',{name:v('sn'),emoji:v('se')||'🏪'},'admin')">Ekle</button></div>
  <h2>İndirim ekle</h2><div class="card col"><select id="ds">${so}</select><input id="dd" placeholder="Açıklama (Tüm içeceklerde)"><input id="dx" placeholder="İndirim (%20)"><button class="btn" onclick="ins('deals',{shop_id:$('ds').value,description:v('dd'),discount:v('dx')},'admin')">Ekle</button></div>
  <h2>Esnafa panel yetkisi</h2><div class="card col"><input id="se2" type="email" placeholder="Esnaf hesabının e-postası"><select id="ss">${so}</select><button class="btn" onclick="setShop()">Yetki ver</button></div>
  <h2>Duyuru ekle</h2><div class="card col"><input id="ac" placeholder="Topluluk / kaynak"><input id="ab" placeholder="Duyuru metni"><button class="btn" onclick="ins('announcements',{community:v('ac'),body:v('ab')},'admin')">Yayınla</button></div>
  <h2>Reklam ekle</h2><div class="card col"><input id="rt" placeholder="Reklam başlığı"><input id="rb" placeholder="Kısa metin"><button class="btn" onclick="ins('ads',{title:v('rt'),body:v('rb')},'admin')">Ekle</button></div>
  <h2>İndirimler</h2>${li(d,"deals",x=>`<b>${esc(x.shops?.name)}</b><small>${esc(x.discount)} · ${esc(x.description)}</small>`)}
  <h2>Duyurular</h2>${li(a,"announcements",x=>`<b>${esc(x.community)}</b><small>${esc(x.body)}</small>`)}
  <h2>Reklamlar</h2>${li(ad,"ads",x=>`<b>${esc(x.title)}</b><small>${esc(x.body)}</small>`)}`;
}
async function setShop(){
  const {error}=await sb.rpc("set_shop_user",{p_email:v("se2"),p_shop:$("ss").value});
  alert(error?error.message:"Yetki verildi.");
}
async function ins(t,o,to){const {error}=await sb.from(t).insert(o);if(error)return alert(error.message);go(to)}
async function del(t,id,to){if(!confirm("Silinsin mi?"))return;const {error}=await sb.from(t).delete().eq("id",id);if(error)alert(error.message);go(to)}

const V={home,deals,list,shop,admin};
function go(t){
  tab=t;document.querySelectorAll("#nav button[data-t]").forEach(b=>b.classList.toggle("on",b.dataset.t===t));
  $("app").innerHTML='<div class="empty" style="margin-top:20px">Yükleniyor…</div>';
  V[t]().then(h=>{if(tab===t)$("app").innerHTML=h});
}
function render(){
  if(!me){$("nav").innerHTML="";return authView()}
  const r=me.role,t=r==="shop"?[]:[["home","🏠","Ana sayfa"],["deals","🎟️","İndirim"],["list","🛍️","İlanlar"]];
  if(r!=="student")t.push(["shop","🏪","Esnaf"]);
  if(r==="admin")t.push(["admin","⚙️","Yönetim"]);
  $("nav").innerHTML=t.map(x=>`<button data-t="${x[0]}"><span>${x[1]}</span>${x[2]}</button>`).join("")+`<button onclick="out()"><span>🚪</span>Çıkış</button>`;
  document.querySelectorAll("#nav button[data-t]").forEach(b=>b.onclick=()=>go(b.dataset.t));
  go(r==="shop"?"shop":"home");
}
load();
</script>
</body>
</html>
